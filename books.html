<!DOCTYPE html>

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Standalone books by A. D. Gorwala, digitised on the Internet Archive.">
<meta name="theme-color" content="#EAE3D2">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23211D17'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='38' fill='%23EAE3D2' text-anchor='middle'%3EO%3C/text%3E%3C/svg%3E">
<title>Opinion — Books</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&family=Source+Serif+4:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EAE3D2;
    --paper-deep:#DFD6BF;
    --ink:#211D17;
    --ink-soft:#4A443A;
    --stamp:#96332A;
    --brass:#8E7136;
    --brass-text:#715A2B;
    --slate:#3E4C59;
    --card:#F4EFE3;
    --rule: rgba(33,29,23,0.18);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:rgba(150,51,42,0.25);}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image: radial-gradient(circle at 1px 1px, rgba(33,29,23,0.05) 1px, transparent 0);
    background-size: 22px 22px;
    color:var(--ink);
    font-family:'Source Serif 4', serif;
    line-height:1.5;
    padding-left:env(safe-area-inset-left);
    padding-right:env(safe-area-inset-right);
    padding-bottom:env(safe-area-inset-bottom);
  }
  a{color:var(--slate);}
  .wrap{max-width:720px;margin:0 auto;padding:0 24px 80px;}

  .masthead{
    padding:48px 24px 22px;
    text-align:center;
    border-bottom:3px double var(--ink);
  }
  .masthead .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--stamp);
    margin-bottom:10px;
  }
  .masthead h1{
    font-family:'Newsreader', serif;
    font-weight:600;
    font-size:clamp(36px,7vw,58px);
    margin:0;
    letter-spacing:0.01em;
  }
  .masthead .tagline{
    font-style:italic;
    color:var(--ink-soft);
    margin-top:8px;
    font-size:16px;
  }
  .nav-links{
    margin-top:16px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
  }
  .nav-links a{
    color:var(--stamp);
    text-decoration:none;
    letter-spacing:0.04em;
    display:inline-block;
    padding:6px 4px;
  }
  .nav-links a:hover{text-decoration:underline;}

  .result-count{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    margin:32px 2px 16px;
  }

  .book-entry{
    padding:20px 0;
    border-bottom:1px solid var(--rule);
  }
  .book-entry:first-of-type{border-top:1px solid var(--rule);}
  .book-title{
    font-family:'Newsreader', serif;
    font-weight:600;
    font-size:21px;
    margin:0 0 6px;
    color:var(--ink);
  }
  .book-citation{
    font-size:15px;
    color:var(--ink-soft);
    margin:0 0 8px;
  }
  .book-citation.missing{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.02em;
    color:var(--brass-text);
  }
  .book-description{
    font-size:15px;
    color:var(--ink);
    margin:0 0 10px;
  }
  .book-description:empty{display:none;}
  .book-entry .scan-link{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:0.05em;
    color:var(--stamp);
    text-decoration:none;
    border-bottom:1px solid var(--stamp);
    padding-bottom:1px;
    display:inline-block;
    min-height:24px;
  }
  .book-entry .scan-link:hover{color:var(--ink);border-color:var(--ink);}
  .book-entry .no-scan{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--ink-soft);
    opacity:0.6;
  }

  .empty, .loading, .error{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    color:var(--ink-soft);
    padding:40px 10px;
    text-align:center;
  }
  .error{color:var(--stamp);}
  .setup-box{
    max-width:640px;
    margin:60px auto;
    background:var(--card);
    border:1px solid var(--rule);
    padding:28px;
    font-size:14px;
  }
  .setup-box h2{font-family:'Newsreader',serif;margin-top:0;}
  .setup-box code{
    background:var(--paper-deep);
    padding:1px 5px;
    word-break:break-word;
    overflow-wrap:anywhere;
  }

  footer{
    text-align:center;
    margin-top:60px;
    padding-top:20px;
    border-top:1px solid var(--rule);
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
  }

  a:focus-visible,
  button:focus-visible{
    outline:2px solid var(--stamp);
    outline-offset:2px;
  }

  .skip-link{
    position:absolute;
    left:-9999px;
    top:0;
    background:var(--ink);
    color:var(--paper);
    padding:12px 18px;
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    z-index:100;
    text-decoration:none;
  }
  .skip-link:focus{left:12px;top:12px;}

  @media (max-width:768px){
    .wrap{padding:0 18px 60px;}
    .masthead{padding:40px 18px 20px;}
  }
  @media (max-width:600px){
    .masthead{padding:32px 14px 18px;}
    .wrap{padding:0 12px 50px;}
  }
  @media (prefers-reduced-motion: reduce){
    *{scroll-behavior:auto !important;}
  }
</style>
</head>
<body>
<a href="#main" class="skip-link">Skip to books listing</a>

<header class="masthead">
  <div class="eyebrow">A Digital Archive of A. D. Gorwala's Writings</div>
  <h1>Books and reports</h1>
  <div class="tagline">Books, collections, and administrative reports</div>
  <nav class="nav-links" aria-label="Site navigation"><a href="index.html">← Home</a> · <a href="issues.html"><em>Opinion</em> →</a></nav>
</header>

<main class="wrap" id="main">
  <div id="result-count" class="result-count" aria-live="polite"></div>
  <div id="books-container"></div>
  <footer id="footer-note"></footer>
</main>

<script>
/* Uses the same Google Sheet as issues.html - paste the same Sheet ID here. */
const SHEET_ID = "1RoiyRmLEn9rTEMQwmhMwBoseVxQDsIlqm_MXuRuJoGs";
const SHEET_NAME = "Books";

/* ============================================================
   EDIT ME: bibliographic citation and a one-line description for
   each book. Keyed by exact title as it appears in the Books sheet.
   Leave a book out of this object (or leave its fields as null) if
   you don't have the citation yet - the page handles that cleanly,
   showing "citation not yet available" rather than guessing.

   Fields:
     author      - e.g. "A. D. Gorwala"
     year        - a NUMBER (used for sorting) or null if unknown
     publisher   - e.g. "Government of India"
     description - one line, plain text. Leave "" for now.
   ============================================================ */
const CITATIONS = {
  "For A Lasting Solution": {
    author: null, year: null, publisher: null, description: ""
  },
  "Kaiser-E-Hind": {
    author: null, year: null, publisher: null, description: ""
  },
  "The Making Of A Marriage (Roumela Alfresun)": {
    author: null, year: null, publisher: null, description: ""
  },
  "Report On Public Administration": {
    author: "A. D. Gorwala", year: 1951, publisher: "Government of India", description: ""
  },
  "The Indian Ideal": {
    author: null, year: null, publisher: null, description: ""
  },
  "The Administrative Jungle": {
    author: null, year: null, publisher: null, description: ""
  },
  "The Delusion Of Decontrol": {
    author: null, year: null, publisher: null, description: ""
  },
  "The Mysore Administration": {
    author: null, year: null, publisher: null, description: ""
  },
  "Not In Our Stars": {
    author: null, year: null, publisher: null, description: ""
  },
  "The Role Of The Administor Past, Present And Future Compressed": {
    author: null, year: null, publisher: null, description: ""
  }
};

function gvizUrl(sheetName){
  return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}`;
}

async function fetchSheet(sheetName){
  const res = await fetch(gvizUrl(sheetName));
  if(!res.ok) throw new Error(`Could not load sheet "${sheetName}" (HTTP ${res.status})`);
  const text = await res.text();
  const jsonStr = text.substring(text.indexOf('{'), text.lastIndexOf('}')+1);
  const data = JSON.parse(jsonStr);
  const cols = data.table.cols.map(c => c.label || c.id);
  return data.table.rows.map(r => {
    const obj = {};
    cols.forEach((c, i) => {
      const cell = r.c[i];
      obj[c] = cell ? (cell.f !== undefined && cell.f !== null ? cell.f : cell.v) : null;
    });
    return obj;
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function buildCitationLine(c){
  const parts = [];
  if(c.author) parts.push(escapeHtml(c.author));
  if(c.publisher) parts.push(escapeHtml(c.publisher));
  if(c.year) parts.push(String(c.year));
  return parts.join(', ');
}

function renderBook(book){
  const citation = CITATIONS[book.title] || {author: null, year: null, publisher: null, description: ''};
  const citationLine = buildCitationLine(citation);

  const citationHtml = citationLine
    ? `<p class="book-citation">${citationLine}</p>`
    : `<p class="book-citation missing">citation not yet available</p>`;

  const descriptionHtml = citation.description
    ? `<p class="book-description">${escapeHtml(citation.description)}</p>`
    : `<p class="book-description"></p>`;

  const linkHtml = book.archive_url
    ? `<a class="scan-link" href="${book.archive_url}" target="_blank" rel="noopener">View scan on Archive.org →</a>`
    : `<span class="no-scan">No scan linked yet</span>`;

  const div = document.createElement('div');
  div.className = 'book-entry';
  div.innerHTML = `
    <h2 class="book-title">${escapeHtml(book.title)}</h2>
    ${citationHtml}
    ${descriptionHtml}
    ${linkHtml}
  `;
  return div;
}

function sortBooks(books){
  return [...books].sort((a, b) => {
    const ca = CITATIONS[a.title] || {};
    const cb = CITATIONS[b.title] || {};
    const ya = ca.year, yb = cb.year;
    if(ya && yb) return ya - yb;
    if(ya && !yb) return -1;   // known dates first
    if(!ya && yb) return 1;
    return a.title.localeCompare(b.title, undefined, {sensitivity: 'base'});
  });
}

function showSetupInstructions(){
  document.getElementById('books-container').innerHTML = `
    <div class="setup-box">
      <h2>One step left: connect the database</h2>
      <p>This page reads live from the same Google Sheet as <code>issues.html</code>.</p>
      <ol>
        <li>Open <code>issues.html</code> and copy the Sheet ID you already pasted there.</li>
        <li>Paste that same ID into <code>books.html</code>, replacing <code>PASTE_YOUR_GOOGLE_SHEET_ID_HERE</code> near the top of its <code>&lt;script&gt;</code> tag.</li>
      </ol>
    </div>`;
}

async function init(){
  if(SHEET_ID === "PASTE_YOUR_GOOGLE_SHEET_ID_HERE"){
    showSetupInstructions();
    return;
  }
  document.getElementById('books-container').innerHTML = `<div class="loading">Loading the books…</div>`;
  try{
    const books = await fetchSheet(SHEET_NAME);
    const sorted = sortBooks(books);

    document.getElementById('result-count').textContent =
      `${books.length} book${books.length===1?"":"s"}, sorted by publication date where known`;
    document.getElementById('footer-note').textContent =
      `Source scans hosted on the Internet Archive · Data last synced ${new Date().toLocaleString('en-GB')}`;

    const container = document.getElementById('books-container');
    container.innerHTML = "";
    if(sorted.length === 0){
      container.innerHTML = `<div class="empty">No books catalogued yet.</div>`;
    } else {
      sorted.forEach(b => container.appendChild(renderBook(b)));
    }
  }catch(err){
    console.error(err);
    document.getElementById('books-container').innerHTML = `<div class="error">Could not load the books: ${escapeHtml(err.message)}<br><br>Make sure the Google Sheet is shared as "Anyone with the link can view".</div>`;
  }
}

init();
</script>
</body>
</html>
