<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="A searchable digitised archive of Opinion, the weekly review founded by A. D. Gorwala in 1960.">
<meta name="theme-color" content="#EAE3D2">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23211D17'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='38' fill='%23EAE3D2' text-anchor='middle'%3EO%3C/text%3E%3C/svg%3E">
<title>Opinion — Digitised Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&family=Source+Serif+4:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EAE3D2;
    --paper-deep:#DFD6BF;
    --ink:#211D17;
    --ink-soft:#4A443A;
    --stamp:#96332A;
    --brass:#8E7136;
    --brass-text:#715A2B;
    --slate:#3E4C59;
    --card:#F4EFE3;
    --rule: rgba(33,29,23,0.18);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:rgba(150,51,42,0.25);}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(33,29,23,0.05) 1px, transparent 0);
    background-size: 22px 22px;
    color:var(--ink);
    font-family:'Source Serif 4', serif;
    line-height:1.5;
    padding-left:env(safe-area-inset-left);
    padding-right:env(safe-area-inset-right);
    padding-bottom:env(safe-area-inset-bottom);
  }
  a{color:var(--slate);}
  .wrap{max-width:920px;margin:0 auto;padding:0 24px 80px;}

  /* Masthead */
  .masthead{
    padding:48px 24px 22px;
    text-align:center;
    border-bottom:3px double var(--ink);
    margin-bottom:0;
  }
  .masthead .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--stamp);
    margin-bottom:10px;
  }
  .masthead h1{
    font-family:'Newsreader', serif;
    font-weight:600;
    font-size:clamp(42px,8vw,72px);
    margin:0;
    letter-spacing:0.01em;
  }
  .masthead .tagline{
    font-style:italic;
    color:var(--ink-soft);
    margin-top:8px;
    font-size:16px;
  }
  .masthead .meta-strip{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    margin-top:14px;
    display:flex;
    justify-content:center;
    gap:18px;
    flex-wrap:wrap;
  }
  .nav-links{
    margin-top:16px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
  }
  .nav-links a{
    color:var(--stamp);
    text-decoration:none;
    letter-spacing:0.04em;
  }
  .nav-links a:hover{text-decoration:underline;}

  /* Toolbar - styled like a library request slip */
  .toolbar{
    margin:28px 0 30px;
    background:var(--card);
    border:1px solid var(--rule);
    padding:18px 20px;
    display:grid;
    grid-template-columns: 1fr auto auto auto;
    gap:14px;
    align-items:end;
  }
  .field label{
    display:block;
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.1em;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .field input, .field select{
    width:100%;
    font-family:'Source Serif 4', serif;
    font-size:16px;
    padding:10px 12px;
    border:1px solid var(--ink-soft);
    background:#fff;
    color:var(--ink);
    min-height:44px;
  }
  .toolbar .field.search{grid-column:1;}
  .surprise-btn{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--stamp);
    background:transparent;
    border:1px solid var(--stamp);
    padding:10px 14px;
    min-height:44px;
    cursor:pointer;
    white-space:nowrap;
  }
  .surprise-btn:hover{background:var(--stamp);color:#fff;}

  @keyframes flash-highlight{
    0%{box-shadow:0 0 0 3px var(--brass);}
    100%{box-shadow:0 0 0 3px transparent;}
  }
  .issue.flash{animation:flash-highlight 1.6s ease-out;}
  @media (prefers-reduced-motion: reduce){
    .issue.flash{animation:none;outline:2px solid var(--brass);}
  }
  @media (max-width:640px){
    .toolbar{grid-template-columns:1fr; }
  }

  .result-count{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    margin:0 2px 16px;
  }

  .fulltext-box{
    margin:24px 0 0;
    background:var(--card);
    border:1px dashed var(--brass);
    padding:18px 20px 20px;
  }
  .fulltext-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:10px;
  }
  .fulltext-head label{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--ink);
  }
  .fulltext-note{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    color:var(--ink-soft);
  }
  #qInside{
    width:100%;
    font-family:'Source Serif 4', serif;
    font-size:16px;
    padding:10px 12px;
    border:1px solid var(--ink-soft);
    background:#fff;
    color:var(--ink);
    min-height:44px;
  }
  #qInside:disabled{background:var(--paper-deep);color:var(--ink-soft);}
  .fulltext-hint{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--ink-soft);
    margin:14px 2px 0;
  }
  .fulltext-issue{
    margin-top:16px;
    padding-top:14px;
    border-top:1px solid var(--rule);
  }
  .fulltext-issue-head{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--brass-text);
    margin-bottom:8px;
  }
  ul.fulltext-pages{list-style:none;margin:0;padding:0;}
  ul.fulltext-pages li{margin-bottom:10px;}
  ul.fulltext-pages a{
    color:var(--stamp);
    text-decoration:underline;
    text-underline-offset:2px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
  }
  ul.fulltext-pages a:hover{color:var(--ink);}
  .snippet{
    font-size:14px;
    color:var(--ink-soft);
    margin-top:4px;
    line-height:1.5;
  }
  .snippet mark{
    background:#F0DCA0;
    color:var(--ink);
    padding:0 2px;
  }

  /* Issue card = catalogue card */
  .issue{
    display:grid;
    grid-template-columns: 84px 1fr;
    background:var(--card);
    border:1px solid var(--rule);
    margin-bottom:14px;
    position:relative;
    content-visibility:auto;
    contain-intrinsic-size:auto 140px;
  }
  .issue .spine{
    background:var(--ink);
    color:var(--paper);
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.06em;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    padding:14px 8px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
  }
  .issue .body{padding:16px 20px;min-width:0;}
  .issue-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:14px;
    flex-wrap:wrap;
  }
  .issue-head .id{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--brass);
  }
  .issue-head .date{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--ink-soft);
  }
  .issue .flag{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    color:var(--stamp);
    border:1px solid var(--stamp);
    padding:2px 6px;
    display:inline-block;
    margin-top:6px;
  }
  .issue .ocr-pending{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    color:var(--ink-soft);
    border:1px dashed var(--brass);
    padding:2px 6px;
    display:inline-block;
    margin-top:6px;
  }
  .toggle-btn{
    margin:10px 0;
    background:none;
    border:none;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.05em;
    color:var(--slate);
    cursor:pointer;
    padding:10px 0;
    min-height:44px;
    display:flex;
    align-items:center;
    text-align:left;
  }
  .toggle-btn:hover{text-decoration:underline;}

  .issue .toc{
    display:none;
    overflow:hidden;
  }
  .issue.pinned .toc{
    display:block;
  }
  @media (hover:hover) and (pointer:fine){
    .issue:hover .toc{
      display:block;
    }
  }
  .scan-link{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.05em;
    color:var(--stamp);
    border:1px solid var(--stamp);
    padding:9px 12px;
    text-decoration:none;
    white-space:nowrap;
    transform:rotate(-1deg);
    display:inline-flex;
    align-items:center;
    min-height:44px;
  }
  .scan-link:hover{background:var(--stamp);color:#fff;}
  .actions{display:flex;gap:8px;flex-wrap:wrap;}
  .pdf-link{
    border-color:var(--brass);
    color:var(--brass);
  }
  .pdf-link:hover{background:var(--brass);color:#fff;}

  .table-scroll{
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    margin-top:14px;
  }
  table.articles{
    width:100%;
    min-width:420px;
    border-collapse:collapse;
    font-size:14px;
  }
  table.articles th{
    text-align:left;
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--ink-soft);
    border-bottom:1px solid var(--ink);
    padding:6px 8px;
  }
  table.articles td{
    padding:6px 8px;
    border-bottom:1px solid var(--rule);
    vertical-align:top;
  }
  table.articles td.pages{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--ink-soft);
    white-space:nowrap;
  }

  .back-to-top{
    display:inline-block;
    margin-top:10px;
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--ink-soft);
    text-decoration:none;
    cursor:pointer;
  }
  .back-to-top:hover{color:var(--stamp);text-decoration:underline;}

  section.group-title{
    font-family:'Newsreader', serif;
    font-size:22px;
    font-weight:600;
    margin:44px 0 6px;
    border-bottom:2px solid var(--ink);
    padding-bottom:6px;
  }

  .empty, .loading, .error{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    color:var(--ink-soft);
    padding:40px 10px;
    text-align:center;
  }
  .error{color:var(--stamp);}
  .setup-box{
    max-width:640px;
    margin:60px auto;
    background:var(--card);
    border:1px solid var(--rule);
    padding:28px;
    font-size:14px;
  }
  .setup-box h2{font-family:'Newsreader',serif;margin-top:0;}
  .setup-box code{background:var(--paper-deep);padding:1px 5px;}

  footer{
    text-align:center;
    margin-top:60px;
    padding-top:20px;
    border-top:1px solid var(--rule);
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
  }

  /* Accessibility: visible keyboard focus everywhere interactive */
  a:focus-visible,
  button:focus-visible,
  input:focus-visible,
  select:focus-visible{
    outline:2px solid var(--stamp);
    outline-offset:2px;
  }

  .skip-link{
    position:absolute;
    left:-9999px;
    top:0;
    background:var(--ink);
    color:var(--paper);
    padding:12px 18px;
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    z-index:100;
    text-decoration:none;
  }
  .skip-link:focus{
    left:12px;
    top:12px;
  }

  /* Tablet */
  @media (max-width:768px){
    .wrap{padding:0 18px 60px;}
    .masthead{padding:40px 18px 20px;}
    .toolbar{padding:16px;}
  }

  /* Mobile */
  @media (max-width:600px){
    .masthead{padding:32px 14px 18px;}
    .wrap{padding:0 12px 50px;}
    .masthead .meta-strip{gap:10px;font-size:10px;}

    .issue, .book{grid-template-columns:48px 1fr;}
    .issue .spine, .book .spine{
      font-size:9px;
      padding:10px 4px;
      letter-spacing:0.03em;
    }
    .issue .body, .book .body{padding:14px 14px;}
    .issue-head, .book-head{
      flex-direction:column;
      align-items:flex-start;
      gap:10px;
    }
    .actions{align-self:flex-start;}
    table.articles, table.sections{min-width:380px;font-size:13px;}
  }

  @media (prefers-reduced-motion: reduce){
    *{scroll-behavior:auto !important;}
  }
</style>
</head>
<body>
<a href="#main" class="skip-link">Skip to archive listing</a>

<header class="masthead">
  <div class="eyebrow">The Digitised Archive</div>
  <h1>Opinion</h1>
  <div class="tagline">A weekly review founded by A. D. Gorwala, May 1960</div>
  <div class="meta-strip" id="meta-strip"></div>
  <nav class="nav-links" aria-label="Site navigation"><a href="index.html">← Home</a> · <a href="books.html">Standalone Books →</a></nav>
</header>

<main class="wrap" id="main">
  <div class="toolbar">
    <div class="field search">
      <label for="q">Search title or author</label>
      <input type="text" id="q" placeholder="e.g. Khushwant Singh, or Nehru…">
    </div>
    <div class="field">
      <label for="view">Show</label>
      <select id="view">
        <option value="digitised">Digitised only</option>
        <option value="all">Full catalogue</option>
      </select>
    </div>
    <div class="field">
      <label for="sort">Sort</label>
      <select id="sort">
        <option value="date_desc">Newest first</option>
        <option value="date_asc">Oldest first</option>
      </select>
    </div>
    <div class="field">
      <label for="surprise-btn">&nbsp;</label>
      <button type="button" id="surprise-btn" class="surprise-btn">🎲 Surprise me</button>
    </div>
  </div>

  <div class="fulltext-box">
    <div class="fulltext-head">
      <label for="qInside">🔎 Search inside the scans (OCR text)</label>
      <span class="fulltext-note" id="fulltext-coverage">Loading search index…</span>
    </div>
    <input type="text" id="qInside" placeholder="e.g. Kashmir, Emergency, corruption…" disabled>
    <div id="fulltext-results" aria-live="polite"></div>
  </div>

  <div id="result-count" class="result-count" aria-live="polite"></div>
  <div id="issues-container"></div>

  <footer id="footer-note"></footer>
</main>

<script>
/* =========================================================
   CONFIGURATION
   Replace with your Google Sheet ID (from its URL) once the
   'Opinion_Digitised_Database' workbook has been uploaded to
   Google Sheets and File > Share > set to "Anyone with the
   link can view".
   ========================================================= */
const SHEET_ID = "PASTE_YOUR_GOOGLE_SHEET_ID_HERE";

const SHEET_NAMES = {
  issues: "Issues",
  articles: "Articles",
  litqIssues: "Literary Quarterly",
  litqArticles: "Literary Quarterly Articles"
};

function gvizUrl(sheetName){
  return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}`;
}

async function fetchSheet(sheetName){
  const res = await fetch(gvizUrl(sheetName));
  if(!res.ok) throw new Error(`Could not load sheet "${sheetName}" (HTTP ${res.status})`);
  const text = await res.text();
  const jsonStr = text.substring(text.indexOf('{'), text.lastIndexOf('}')+1);
  const data = JSON.parse(jsonStr);
  const cols = data.table.cols.map(c => c.label || c.id);
  const rows = data.table.rows.map(r => {
    const obj = {};
    cols.forEach((c, i) => {
      const cell = r.c[i];
      obj[c] = cell ? (cell.f !== undefined && cell.f !== null ? cell.f : cell.v) : null;
    });
    return obj;
  });
  return rows;
}

let ISSUES = [], ARTICLES = [], LITQ_ISSUES = [], LITQ_ARTICLES = [];
let CURRENT_POOL = [];
let SEARCH_INDEX = [];
let LAST_SURPRISE = null;

function fmtDate(d){
  if(!d) return "—";
  const dt = new Date(d);
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'});
}

function articlesFor(issueId){
  return ARTICLES.filter(a => String(a.issue_id) === String(issueId));
}

function renderIssue(issue){
  const arts = articlesFor(issue.issue_id);
  const flag = issue.flags ? `<div class="flag">⚑ ${issue.flags}</div>` : "";
  const label = `VOL ${issue.volume_roman_numeral || issue.volume || "?"} / NO ${issue.issue_no ?? "?"}`;

  const artRows = arts.map(a => `
    <tr>
      <td>${a.author ? escapeHtml(a.author) : '<em>—</em>'}</td>
      <td>${escapeHtml(a.title || '')}</td>
      <td class="pages">${a.pages ? escapeHtml(String(a.pages)) : '—'}</td>
    </tr>`).join("");

  const artTable = arts.length ? `
    <div class="table-scroll"><table class="articles">
      <thead><tr><th>Author</th><th>Title</th><th>Pages</th></tr></thead>
      <tbody>${artRows}</tbody>
    </table></div>` : `<p style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);margin-top:12px;">No article-level index available for this issue yet.</p>`;

  const ocrNote = (issue.is_digitised && issue.has_ocr_text === false)
    ? `<div class="ocr-pending">⚑ scan available, not yet full-text searchable (OCR pending on Archive.org)</div>`
    : '';

  const scanLink = issue.is_digitised && issue.archive_url
    ? `<div class="actions">
        <a class="scan-link" href="${issue.archive_url}" target="_blank" rel="noopener">VIEW SCAN →</a>
        <a class="scan-link pdf-link" href="${issue.archive_url}" data-url="${issue.archive_url}" onclick="openArchivePdf(event)" target="_blank" rel="noopener">PDF ↓</a>
      </div>`
    : `<span class="scan-link" style="opacity:0.45;cursor:default;pointer-events:none;">NOT DIGITISED</span>`;

  const div = document.createElement('div');
  div.className = 'issue';
  div.id = `card-issue-${issue.issue_id}`;
  const tocId = `toc-${issue.issue_id}`;
  div.innerHTML = `
    <div class="spine">${escapeHtml(label)}</div>
    <div class="body">
      <div class="issue-head">
        <div>
          <div class="id">Opinion</div>
          <div class="date">${fmtDate(issue.date)}</div>
          ${flag}
          ${ocrNote}
        </div>
        ${scanLink}
      </div>
      <button class="toggle-btn" data-open="false" aria-controls="${tocId}">▸ ${arts.length} article${arts.length===1?"":"s"}${pinHint(false)}</button>
      <div class="toc" id="${tocId}">${artTable}<a class="back-to-top" onclick="scrollToTop(event)">↑ Back to top</a></div>
    </div>
  `;
  attachPinToggle(div, arts.length, 'article');
  return div;
}

function renderLitqIssue(issue){
  const arts = LITQ_ARTICLES.filter(a => String(a.issue_id) === String(issue.issue_id));
  const flag = issue.flags ? `<div class="flag">⚑ ${issue.flags}</div>` : "";
  const label = `VOL ${issue.volume ?? "?"} · ${issue.label ?? ""}`;
  const artRows = arts.map(a => `
    <tr>
      <td>${a.author ? escapeHtml(a.author) : '<em>—</em>'}</td>
      <td>${escapeHtml(a.title || '')}</td>
      <td class="pages">${a.pages ? escapeHtml(String(a.pages)) : '—'}</td>
    </tr>`).join("");
  const artTable = arts.length ? `
    <div class="table-scroll"><table class="articles">
      <thead><tr><th>Author</th><th>Title</th><th>Pages</th></tr></thead>
      <tbody>${artRows}</tbody>
    </table></div>` : `<p style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);margin-top:12px;">No article-level index available.</p>`;

  const div = document.createElement('div');
  div.className = 'issue';
  div.id = `card-litq-${issue.issue_id}`;
  const tocId = `toc-litq-${issue.issue_id}`;
  div.innerHTML = `
    <div class="spine">${escapeHtml(label)}</div>
    <div class="body">
      <div class="issue-head">
        <div>
          <div class="id">Opinion Literary Quarterly</div>
          ${flag}
        </div>
        <div class="actions">
          <a class="scan-link" href="${issue.archive_url}" target="_blank" rel="noopener">VIEW SCAN →</a>
          <a class="scan-link pdf-link" href="${issue.archive_url}" data-url="${issue.archive_url}" onclick="openArchivePdf(event)" target="_blank" rel="noopener">PDF ↓</a>
        </div>
      </div>
      <button class="toggle-btn" data-open="false" aria-controls="${tocId}">▸ ${arts.length} article${arts.length===1?"":"s"}${pinHint(false)}</button>
      <div class="toc" id="${tocId}">${artTable}<a class="back-to-top" onclick="scrollToTop(event)">↑ Back to top</a></div>
    </div>
  `;
  attachPinToggle(div, arts.length, 'article');
  return div;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

const HAS_HOVER = window.matchMedia('(hover:hover) and (pointer:fine)').matches;

function debounce(fn, wait){
  let t;
  return (...args) => {
    clearTimeout(t);
    t = setTimeout(() => fn(...args), wait);
  };
}

function scrollToTop(e){
  if(e) e.stopPropagation();
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  window.scrollTo({top: 0, behavior: reduceMotion ? 'auto' : 'smooth'});
}

function buildSnippet(text, query){
  const lower = text.toLowerCase();
  const idx = lower.indexOf(query.toLowerCase());
  if(idx === -1) return '';
  const start = Math.max(0, idx - 60);
  const end = Math.min(text.length, idx + query.length + 100);
  const before = escapeHtml(text.slice(start, idx));
  const match = escapeHtml(text.slice(idx, idx + query.length));
  const after = escapeHtml(text.slice(idx + query.length, end));
  return (start > 0 ? '…' : '') + before + '<mark>' + match + '</mark>' + after + (end < text.length ? '…' : '');
}

function searchInsideScans(query){
  const q = query.toLowerCase();
  const hits = [];
  for(const entry of SEARCH_INDEX){
    if(entry.text.toLowerCase().includes(q)){
      hits.push(entry);
      if(hits.length >= 600) break; // safety cap on a pathological common-word query
    }
  }
  return hits;
}

function renderFulltextResults(){
  const query = document.getElementById('qInside').value.trim();
  const container = document.getElementById('fulltext-results');

  if(query.length === 0){
    container.innerHTML = '';
    return;
  }
  if(query.length < 3){
    container.innerHTML = `<p class="fulltext-hint">Keep typing — at least 3 characters.</p>`;
    return;
  }

  const hits = searchInsideScans(query);
  if(hits.length === 0){
    container.innerHTML = `<p class="fulltext-hint">No matches found inside the scanned text.</p>`;
    return;
  }

  const byIssue = new Map();
  for(const h of hits){
    if(!byIssue.has(h.issue_id)) byIssue.set(h.issue_id, []);
    byIssue.get(h.issue_id).push(h);
  }
  const issueIds = [...byIssue.keys()];
  const shown = issueIds.slice(0, 40);
  const truncatedNote = issueIds.length > shown.length
    ? ` (showing the first 40 — narrow your search for more precise results)` : '';

  let html = `<p class="fulltext-hint">${hits.length} matching page${hits.length===1?'':'s'} across ${issueIds.length} issue${issueIds.length===1?'':'s'}${truncatedNote}</p>`;

  for(const issueId of shown){
    const pages = byIssue.get(issueId);
    const issue = ISSUES.find(i => String(i.issue_id) === String(issueId));
    const identifier = pages[0].identifier;
    const label = issue
      ? `Vol ${issue.volume_roman_numeral || issue.volume} / No ${issue.issue_no}${issue.date ? ' · ' + fmtDate(issue.date) : ''}`
      : `Issue ${issueId}`;

    const pageLinks = pages.slice(0, 8).map(p => `
      <li>
        <a href="https://archive.org/details/${identifier}/page/n${p.leaf}" target="_blank" rel="noopener">Page ${p.leaf + 1} →</a>
        <div class="snippet">${buildSnippet(p.text, query)}</div>
      </li>`).join('');

    html += `
      <div class="fulltext-issue">
        <div class="fulltext-issue-head">${escapeHtml(label)}</div>
        <ul class="fulltext-pages">${pageLinks}</ul>
      </div>`;
  }

  container.innerHTML = html;
}

async function loadSearchIndex(){
  const noteEl = document.getElementById('fulltext-coverage');
  const inputEl = document.getElementById('qInside');
  try{
    const res = await fetch('search-index.json');
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    SEARCH_INDEX = await res.json();
    const coveredIdentifiers = new Set(SEARCH_INDEX.map(e => e.identifier));
    const digitisedCount = ISSUES.filter(i => i.is_digitised).length;
    noteEl.textContent = `Searching within ${coveredIdentifiers.size} of ${digitisedCount} digitised issues`;
    inputEl.disabled = false;
    inputEl.addEventListener('input', debounce(renderFulltextResults, 200));
  }catch(err){
    console.error('Could not load search-index.json:', err);
    noteEl.textContent = 'Full-text search index not found on this server yet.';
  }
}

function surpriseMe(){
  if(!CURRENT_POOL.length) return;
  let pick = CURRENT_POOL[Math.floor(Math.random() * CURRENT_POOL.length)];
  if(CURRENT_POOL.length > 1){
    while(LAST_SURPRISE && pick.type === LAST_SURPRISE.type && pick.id === LAST_SURPRISE.id){
      pick = CURRENT_POOL[Math.floor(Math.random() * CURRENT_POOL.length)];
    }
  }
  LAST_SURPRISE = pick;

  const domId = pick.type === 'issue' ? `card-issue-${pick.id}` : `card-litq-${pick.id}`;
  const el = document.getElementById(domId);
  if(!el) return;

  const btn = el.querySelector('.toggle-btn');
  if(btn && btn.dataset.open !== 'true') btn.click();

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  el.scrollIntoView({behavior: reduceMotion ? 'auto' : 'smooth', block:'center'});

  el.classList.remove('flash');
  void el.offsetWidth; // restart animation if the same card is flashed again
  el.classList.add('flash');
}

async function openArchivePdf(e){
  e.preventDefault();
  const btn = e.currentTarget;
  const detailsUrl = btn.dataset.url;
  const m = detailsUrl.match(/\/details\/([^\/]+)/);
  // Open the tab synchronously (within the click's gesture) so popup blockers
  // don't kill it once we go async to look up the real PDF filename.
  const win = window.open('', '_blank');
  if(!m){
    if(win) win.location.href = detailsUrl;
    return;
  }
  const identifier = m[1];
  const original = btn.textContent;
  btn.textContent = 'PDF…';
  try{
    const res = await fetch(`https://archive.org/metadata/${identifier}`);
    const data = await res.json();
    const pdfFile = (data.files || []).find(f => f.name && f.name.toLowerCase().endsWith('.pdf'));
    const target = pdfFile
      ? `https://archive.org/download/${identifier}/${encodeURIComponent(pdfFile.name)}`
      : detailsUrl;
    if(win) win.location.href = target;
    else window.open(target, '_blank', 'noopener');
  }catch(err){
    console.error('PDF lookup failed:', err);
    if(win) win.location.href = detailsUrl;
    else window.open(detailsUrl, '_blank', 'noopener');
  }finally{
    btn.textContent = original;
  }
}

function pinHint(open){
  if(HAS_HOVER) return open ? " — pinned open (click to unpin)" : " — hover to preview, click to pin";
  return open ? " — tap to close" : " — tap to view";
}

function attachPinToggle(div, count, noun){
  const btn = div.querySelector('.toggle-btn');
  btn.setAttribute('aria-expanded', 'false');
  btn.addEventListener('click', () => {
    const open = btn.dataset.open === "true";
    div.classList.toggle('pinned', !open);
    btn.dataset.open = (!open).toString();
    btn.setAttribute('aria-expanded', (!open).toString());
    btn.textContent = (open ? "▸ " : "▾ ") + count + ` ${noun}${count===1?"":"s"}` + pinHint(!open);
  });
}

function applyFiltersAndRender(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  const view = document.getElementById('view').value; // 'digitised' | 'all'
  const sort = document.getElementById('sort').value;

  let matchingIssueIds = null, matchingLitqIds = null;
  if(q){
    matchingIssueIds = new Set();
    matchingLitqIds = new Set();
    ISSUES.forEach(iss => {
      const haystack = String(iss.issue_no ?? '').toLowerCase();
      if(haystack.includes(q)) matchingIssueIds.add(String(iss.issue_id));
    });
    ARTICLES.forEach(a => {
      const haystack = [a.author, a.title].join(' ').toLowerCase();
      if(haystack.includes(q)) matchingIssueIds.add(String(a.issue_id));
    });
    LITQ_ARTICLES.forEach(a => {
      const haystack = [a.author, a.title].join(' ').toLowerCase();
      if(haystack.includes(q)) matchingLitqIds.add(String(a.issue_id));
    });
  }

  let filtered = ISSUES.filter(iss => {
    if(view === 'digitised' && !iss.is_digitised) return false;
    if(matchingIssueIds && !matchingIssueIds.has(String(iss.issue_id))) return false;
    return true;
  });
  let filteredLitq = LITQ_ISSUES.filter(iss => {
    if(view === 'digitised') return false; // literary quarterly has no non-digitised entries tracked yet
    if(matchingLitqIds && !matchingLitqIds.has(String(iss.issue_id))) return false;
    return true;
  });

  filtered.sort((a,b) => {
    const da = a.date ? new Date(a.date).getTime() : 0;
    const db = b.date ? new Date(b.date).getTime() : 0;
    return sort === 'date_asc' ? da-db : db-da;
  });

  const container = document.getElementById('issues-container');
  container.innerHTML = "";
  if(filtered.length === 0 && filteredLitq.length === 0){
    container.innerHTML = `<div class="empty">No issues match that search.</div>`;
  } else {
    filtered.forEach(iss => container.appendChild(renderIssue(iss)));
    filteredLitq.forEach(iss => container.appendChild(renderLitqIssue(iss)));
    if(q){
      // a search is active - expand every result's table of contents automatically
      // rather than making the person click through each one individually
      container.querySelectorAll('.toggle-btn').forEach(btn => {
        if(btn.dataset.open !== 'true') btn.click();
      });
    }
  }
  const totalShown = filtered.length + filteredLitq.length;
  document.getElementById('result-count').textContent =
    `${totalShown} issue${totalShown===1?"":"s"} shown` +
    (view === 'digitised' ? ` (of ${ISSUES.length + LITQ_ISSUES.length} in the full catalogue)` : ` · ${ARTICLES.length + LITQ_ARTICLES.length} articles indexed in total`);

  CURRENT_POOL = filtered.map(i => ({type:'issue', id:i.issue_id}))
    .concat(filteredLitq.map(i => ({type:'litq', id:i.issue_id})));
}

function showSetupInstructions(err){
  document.getElementById('issues-container').innerHTML = `
    <div class="setup-box">
      <h2>One step left: connect the database</h2>
      <p>This page reads live from a Google Sheet, but it isn't connected yet.</p>
      <ol>
        <li>Upload <code>Opinion_Digitised_Database.xlsx</code> to Google Sheets (File → Import).</li>
        <li>Share it: <code>Share → General access → Anyone with the link → Viewer</code>.</li>
        <li>Copy the Sheet ID from its URL — the long string between <code>/d/</code> and <code>/edit</code>.</li>
        <li>Open this file and replace <code>PASTE_YOUR_GOOGLE_SHEET_ID_HERE</code> near the top of the <code>&lt;script&gt;</code> with that ID.</li>
      </ol>
      <p style="color:var(--stamp);">${err ? escapeHtml(err.message) : ""}</p>
    </div>`;
}

function toBool(v){
  if(typeof v === 'boolean') return v;
  return String(v ?? '').trim().toUpperCase() === 'TRUE';
}

function toTriBool(v){
  if(v === null || v === undefined || v === '') return null;
  if(typeof v === 'boolean') return v;
  const s = String(v).trim().toUpperCase();
  if(s === 'TRUE') return true;
  if(s === 'FALSE') return false;
  return null;
}

async function init(){
  if(SHEET_ID === "PASTE_YOUR_GOOGLE_SHEET_ID_HERE"){
    showSetupInstructions();
    return;
  }
  document.getElementById('issues-container').innerHTML = `<div class="loading">Loading the archive…</div>`;
  try{
    [ISSUES, ARTICLES, LITQ_ISSUES, LITQ_ARTICLES] = await Promise.all([
      fetchSheet(SHEET_NAMES.issues),
      fetchSheet(SHEET_NAMES.articles),
      fetchSheet(SHEET_NAMES.litqIssues),
      fetchSheet(SHEET_NAMES.litqArticles)
    ]);

    ISSUES = ISSUES.map(row => ({
      ...row,
      is_digitised: toBool(row.is_digitised),
      has_ocr_text: toTriBool(row.has_ocr_text)
    }));

    const years = ISSUES.map(i => i.date && new Date(i.date).getFullYear()).filter(Boolean);
    const minY = Math.min(...years), maxY = Math.max(...years);
    const digitisedCount = ISSUES.filter(i => i.is_digitised).length;
    document.getElementById('meta-strip').innerHTML =
      `<span>${ISSUES.length} issues catalogued</span><span>·</span><span>${digitisedCount} digitised</span><span>·</span><span>${minY}–${maxY}</span>`;
    document.getElementById('footer-note').textContent =
      `Source scans hosted on the Internet Archive · Data last synced ${new Date().toLocaleString('en-GB')}`;

    document.getElementById('q').addEventListener('input', debounce(applyFiltersAndRender, 180));
    document.getElementById('view').addEventListener('change', applyFiltersAndRender);
    document.getElementById('sort').addEventListener('change', applyFiltersAndRender);
    document.getElementById('surprise-btn').addEventListener('click', surpriseMe);

    applyFiltersAndRender();
    loadSearchIndex(); // independent of the main data load; a missing index shouldn't break the page
  }catch(err){
    console.error(err);
    document.getElementById('issues-container').innerHTML = `<div class="error">Could not load the archive: ${escapeHtml(err.message)}<br><br>Make sure the Google Sheet is shared as "Anyone with the link can view".</div>`;
  }
}

init();
</script>
